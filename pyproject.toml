[project]
name = "call-rubric"
version = "0.1.0"
description = "Rule-based grader for outbound voice-agent call transcripts."
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ricardo Delgado" }]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
